name: Update README

on:
  push:
    branches: [main]
    paths:
      - package.json
      - scripts/update-readme.mjs
      - src/**
      - .github/workflows/readme.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh the coverage summary
        run: npm run coverage
      - name: Regenerate the README
        run: npm run readme
      - name: Commit the README when it changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: auto-update README"
            git push
          else
            echo "README is already up to date"
          fi
